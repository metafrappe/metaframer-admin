name: metaframer-headless-api
services:
  api:
    image: metaframer-headless-api:${RELEASE_TAG:?Set the deployed commit tag}
    build:
      context: ..
    network_mode: host
    environment:
      NODE_ENV: production
      API_ONLY: "1"
      AUTH_MODE: bearer
      HOST: 127.0.0.1
      PORT: "4300"
      APP_ORIGIN: https://metafrappe.github.io
      ALLOWED_ORIGINS: https://metafrappe.github.io
      FRAPPE_URL: https://erp-test.metaframer.net
      SESSION_SECRET: ${SESSION_SECRET:?Set a random session secret}
      CATALOG_SHARED_SECRET: ${CATALOG_SHARED_SECRET:?Set a random catalog secret}
      FRAPPE_CATALOG_TOKEN: ${FRAPPE_CATALOG_TOKEN:?Provision the read-only catalog account first}
      CATALOG_ITEM_GROUP: Metaframer Demo
      TRUSTED_PROXY_IPS: 127.0.0.1,::1
      ENABLE_LOCAL_SETUP: "0"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4300/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
