name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE_PATH: /metaframer-admin/
          VITE_ROUTER_MODE: hash
          VITE_API_BASE_URL: https://headless-api.metaframer.net
          VITE_AUTH_MODE: bearer
          VITE_ADMIN_URL: https://metafrappe.github.io/metaframer-admin/
          VITE_STOREFRONT_URL: https://metafrappe.github.io/metaframer-storefront/
      - run: touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/client
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish static interface
        id: deployment
        uses: actions/deploy-pages@v4
